
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Cards</title>
    <link rel="stylesheet" href="cars.css">
</head>
<body>

    <main class="cards-container">

        <div class="card">
            <img src="https://placehold.co/300x180?text=Lenovo+Laptop"
                 alt="Lenovo laptop">

            <div class="card-content">
                <h2>Laptop</h2>
                <p>Lenovo Intel Core i5 12th Gen</p>

                <div class="card-buttons">
                    <button type="button">View</button>
                    <button type="button">Buy</button>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x180?text=HP+Laptop"
                 alt="HP laptop">

            <div class="card-content">
                <h2>Laptop</h2>
                <p>HP Intel Core i5 Laptop</p>

                <div class="card-buttons">
                    <button type="button">View</button>
                    <button type="button">Buy</button>
                </div>
            </div>
        </div>

        <div class="card">
            <img src="https://placehold.co/300x180?text=Dell+Laptop"
                 alt="Dell laptop">

            <div class="card-content">
                <h2>Laptop</h2>
                <p>Dell Intel Core i5 Laptop</p>

                <div class="card-buttons">
                    <button type="button">View</button>
                    <button type="button">Buy</button>
                </div>
            </div>
        </div>

    </main>

</body>
</html>
